
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --cream: #fff9e9;
      --butter: #ffe89a;
      --yellow: #ffd45f;
      --ink: #403626;
      --muted: #776b57;
      --card: #fffdf6;
      --line: #f0dfad;
      --green: #e3efcf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, #ffe08760 0 90px, transparent 92px),
        radial-gradient(circle at 92% 28%, #ffdac760 0 105px, transparent 107px),
        var(--cream);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }

    button { font: inherit; }

    .wrap {
      width: min(940px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 60px;
    }

    header { text-align: center; margin-bottom: 28px; }

    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fffdf5;
      color: #876b23;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.2;
      letter-spacing: -.055em;
    }

    .subtitle {
      max-width: 580px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.8vw, 1.15rem);
    }

    .sparkle { color: #e7a900; }

    .panel {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 253, 246, .94);
      box-shadow: 0 14px 35px #70551c14;
    }

    .section-title {
      margin: 0 0 7px;
      font-size: clamp(1.25rem, 3vw, 1.55rem);
      letter-spacing: -.03em;
    }

    .section-help { margin: 0 0 20px; color: var(--muted); }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .type-button {
      min-height: 58px;
      border: 1.5px solid #ecdcae;
      border-radius: 15px;
      background: #fff9e7;
      color: var(--ink);
      font-size: 1.04rem;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .type-button:hover {
      transform: translateY(-2px);
      background: var(--butter);
      border-color: #e5bd42;
    }

    .type-button:focus-visible,
    .action-button:focus-visible {
      outline: 3px solid #9a7415;
      outline-offset: 3px;
    }

    .type-button[aria-pressed="true"] {
      background: var(--yellow);
      border-color: #d5a526;
      box-shadow: inset 0 0 0 1px #d5a526;
    }

    .result {
      display: none;
      margin-top: 24px;
      animation: appear .28s ease-out;
    }

    .result.visible { display: block; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 14px 35px #70551c14;
    }

    .result-top {
      padding: 26px 24px 22px;
      text-align: center;
      background: linear-gradient(135deg, #fff0b9, #fff8df 72%);
    }

    .chosen-type {
      display: inline-block;
      padding: 5px 13px;
      border-radius: 999px;
      background: #fffdf6;
      color: #7d611c;
      font-size: .92rem;
      font-weight: 850;
    }

    .pokemon-emoji {
      margin: 8px 0 0;
      font-size: clamp(5rem, 18vw, 8rem);
      line-height: 1.3;
      filter: drop-shadow(0 7px 0 #976f1814);
    }

    .pokemon-name {
      margin: 0;
      font-size: clamp(2rem, 6vw, 2.8rem);
      letter-spacing: -.05em;
    }

    .pokemon-tagline { margin: 5px 0 0; color: #79663a; }

    .result-body { padding: clamp(20px, 4vw, 30px); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
    }

    .detail-box {
      padding: 19px;
      border-radius: 19px;
      background: #fff8e5;
    }

    .detail-box.compat { background: var(--green); }

    .detail-box h3 {
      margin: 0 0 8px;
      font-size: 1.08rem;
    }

    .detail-box p { margin: 0; color: #554a38; }

    .compat-type {
      display: inline-block;
      margin: 1px 0 7px;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .action-row {
      display: flex;
      justify-content: center;
      margin-top: 23px;
    }

    .action-button {
      padding: 13px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #c9b98f;
      transition: transform .15s ease;
    }

    .action-button:hover { transform: translateY(-2px); }

    footer {
      margin-top: 22px;
      color: #8a7c63;
      text-align: center;
      font-size: .88rem;
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 22px, 940px);
        padding-top: 28px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .type-button {
        min-height: 50px;
        border-radius: 12px;
        font-size: .94rem;
      }

      .detail-grid { grid-template-columns: 1fr; }
      .panel, .result-card { border-radius: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="eyebrow">✦ 나만의 포켓몬 찾기 ✦</span>
      <h1>MBTI로 포켓몬 찾기 <span class="sparkle">!</span></h1>
      <p class="subtitle">
        내 성격과 닮은 포켓몬은 누구일까요?<br>
        MBTI를 고르고 나와 찰떡인 친구를 만나 보세요.
      </p>
    </header>

    <section class="panel" aria-labelledby="choose-title">
      <h2 class="section-title" id="choose-title">
        🌼 나의 MBTI를 골라 주세요
      </h2>
      <p class="section-help">
        16가지 유형 중 하나를 누르면 결과가 짠! 하고 나타나요.
      </p>

      <div class="mbti-grid" id="mbtiGrid" aria-label="MBTI 유형 선택">
        <button class="type-button" data-type="ISTJ" aria-pressed="false">ISTJ</button>
        <button class="type-button" data-type="ISFJ" aria-pressed="false">ISFJ</button>
        <button class="type-button" data-type="INFJ" aria-pressed="false">INFJ</button>
        <button class="type-button" data-type="INTJ" aria-pressed="false">INTJ</button>
        <button class="type-button" data-type="ISTP" aria-pressed="false">ISTP</button>
        <button class="type-button" data-type="ISFP" aria-pressed="false">ISFP</button>
        <button class="type-button" data-type="INFP" aria-pressed="false">INFP</button>
        <button class="type-button" data-type="INTP" aria-pressed="false">INTP</button>
        <button class="type-button" data-type="ESTP" aria-pressed="false">ESTP</button>
        <button class="type-button" data-type="ESFP" aria-pressed="false">ESFP</button>
        <button class="type-button" data-type="ENFP" aria-pressed="false">ENFP</button>
        <button class="type-button" data-type="ENTP" aria-pressed="false">ENTP</button>
        <button class="type-button" data-type="ESTJ" aria-pressed="false">ESTJ</button>
        <button class="type-button" data-type="ESFJ" aria-pressed="false">ESFJ</button>
        <button class="type-button" data-type="ENFJ" aria-pressed="false">ENFJ</button>
        <button class="type-button" data-type="ENTJ" aria-pressed="false">ENTJ</button>
      </div>
    </section>

    <section class="result" id="result" aria-live="polite" aria-atomic="true">
      <div class="result-card">
        <div class="result-top">
          <span class="chosen-type" id="chosenType">나의 유형 · INFP</span>
          <div class="pokemon-emoji" id="pokemonEmoji" role="img">🌱</div>
          <h2 class="pokemon-name" id="pokemonName">이상해씨</h2>
          <p class="pokemon-tagline" id="pokemonTagline">
            다정한 마음으로 천천히 성장하는 친구
          </p>
        </div>

        <div class="result-body">
          <div class="detail-grid">
            <div class="detail-box">
              <h3>💛 왜 나와 닮았을까요?</h3>
              <p id="reason"></p>
            </div>
            <div class="detail-box compat">
              <h3>🤝 잘 맞는 유형</h3>
              <div class="compat-type" id="compatType">ENFJ</div>
              <p id="compatReason"></p>
            </div>
          </div>

          <div class="action-row">
            <button class="action-button" id="resetButton" type="button">
              ↩ 다시 고르기
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer>
      재미로 즐기는 성격 유형 콘텐츠예요.
      모든 유형과 포켓몬은 저마다의 매력이 있답니다 ✨
    </footer>
  </main>

        ],
        match: "INTP",
        matchReason: "INTP의 독창적인 분석이 ENTJ의 전략을 더 풍성하게 하고, ENTJ의 추진력이 아이디어를 현실로 이끌어요."
      }
    };

    const buttons = document.querySelectorAll(".type-button");
    const result = document.getElementById("result");

    function chooseType(type) {
      const data = pokemonByType[type];
      if (!data) return;

      document.getElementById("chosenType").textContent =
        "나의 유형 · " + type;
      document.getElementById("pokemonEmoji").textContent = data.emoji;
      document.getElementById("pokemonEmoji").setAttribute(
        "aria-label", data.name + " 느낌의 이모지"
      );
      document.getElementById("pokemonName").textContent = data.name;
      document.getElementById("pokemonTagline").textContent = data.tagline;

      // 설명 두 줄을 안전하게 표시합니다.
      const reason = document.getElementById("reason");
      reason.replaceChildren();
      data.reason.forEach((line, index) => {
        if (index > 0) reason.appendChild(document.createElement("br"));
        reason.appendChild(document.createTextNode(line));
      });

      document.getElementById("compatType").textContent = data.match;
      document.getElementById("compatReason").textContent = data.matchReason;

      buttons.forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.type === type)
        );
      });

      result.classList.remove("visible");
      void result.offsetWidth;
      result.classList.add("visible");
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        chooseType(button.dataset.type);
      });
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      result.classList.remove("visible");

      buttons.forEach(button => {
        button.setAttribute("aria-pressed", "false");
      });

      document.querySelector(".panel").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      buttons[0].focus({ preventScroll: true });
    });
  </script>
</body>
</html>
